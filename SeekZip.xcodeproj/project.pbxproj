		B5190ABEC76A4D028F91E9CC = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = ();
			inputPaths = ();
			name = "Bundle Engines";
			outputPaths = ();
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# M7: copy the packaged engine binaries (7zz, lsar, unar + License.txt)\n# staged by scripts/package-engines.sh into build/Helpers, then sign\n# the helpers so they inherit the app sandbox (SeekZip/Helpers.entitlements).\n# A plain `xcodebuild build` without packaged engines still succeeds:\n# the app then falls back to engines on PATH (see BundledEngines).\nset -e\nHELPERS_DIR=\"${PROJECT_DIR}/build/Helpers\"\nDEST=\"${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/Helpers\"\nif [ ! -d \"$HELPERS_DIR\" ]; then\n  echo \"warning: build/Helpers not found - run scripts/package-engines.sh before archiving; the app will fall back to engines on PATH.\"\n  exit 0\nfi\nmkdir -p \"$DEST\"\nfor f in 7zz lsar unar License.txt; do\n  [ -f \"$HELPERS_DIR/$f\" ] && cp -f \"$HELPERS_DIR/$f\" \"$DEST/\"\ndone\nif [ \"${CODE_SIGNING_ALLOWED}\" != \"NO\" ] && [ -n \"${CODE_SIGN_IDENTITY}\" ] && [ \"${CODE_SIGN_IDENTITY}\" != \"-\" ]; then\n  for bin in 7zz lsar unar; do\n    if [ -f \"$DEST/$bin\" ]; then\n      /usr/bin/codesign --force --sign \"${CODE_SIGN_IDENTITY}\" --entitlements \"${PROJECT_DIR}/SeekZip/Helpers.entitlements\" --timestamp --options runtime \"$DEST/$bin\"\n    fi\n  done\nfi\n";
		};
