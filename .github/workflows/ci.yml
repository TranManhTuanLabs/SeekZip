name: CI
# xcodebuild output is piped through xcbeautify so CI logs stay readable:
# full test results are kept while compile noise is dropped. Do NOT filter
# logs to errors only: failing tests show as "recorded an issue" lines, not
# "error" lines, and warnings can be clues.

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # Apple Silicon runner — matches the app's target platform.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install 7-Zip engine
        run: brew install sevenzip unar xcbeautify

      - name: Build (core, CLI, MCP, app)
        run: swift build

      - name: Build Xcode project (app + extensions, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SeekZip.xcodeproj -scheme SeekZip -configuration Debug build CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Unit tests
        run: swift test

      - name: Generate test fixtures
        run: |
          chmod +x Tests/Matrix/generate-matrix.sh
          Tests/Matrix/generate-matrix.sh /tmp/fixtures

      - name: Matrix smoke tests via CLI
        run: |
          BIN=.build/debug/seekzip
          $BIN list --json /tmp/fixtures/plain.zip > /dev/null
          $BIN list --json /tmp/fixtures/solid.7z > /dev/null
          $BIN test /tmp/fixtures/plain.zip
          $BIN test /tmp/fixtures/encrypted-headers.7z && exit 1 || true # needs password
          $BIN list /tmp/fixtures/truncated.zip && exit 1 || true        # must fail cleanly
          $BIN list --stream /tmp/fixtures/big.zip > /dev/null
          $BIN list /tmp/fixtures/nested.zip inner.zip
          $BIN preview /tmp/fixtures/nested.zip "inner.zip!/src/hello.txt"
          $BIN verify /tmp/fixtures/plain.zip
          $BIN convert /tmp/fixtures/plain.zip /tmp/converted.7z
          $BIN test /tmp/converted.7z
          mkdir -p /tmp/out
          $BIN extract /tmp/fixtures/plain.zip /tmp/out
          test -f "/tmp/out/src/hello.txt"
          # zip-slip must be blocked with exit code 4
          $BIN extract /tmp/fixtures/zip-slip.zip /tmp/out && exit 1 || test $? -eq 4

  build-app:
    # Test build, on demand: only runs when the commit message contains
    # [build-app]. Builds the app (unsigned, Release) with the engines
    # bundled, packages it as a zip (ditto keeps the .app bundle intact,
    # like TransPeek does), and uploads the zip as a downloadable
    # artifact, so the app can be tested without installing Xcode
    # locally. Only runs after build-and-test passes.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-app]')
    needs: build-and-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install 7-Zip engine
        run: brew install sevenzip unar xcbeautify

      - name: Stage engines into build/Helpers
        run: bash scripts/package-engines.sh

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SeekZip.xcodeproj -scheme SeekZip -configuration Release build CODE_SIGNING_ALLOWED=NO -derivedDataPath .build/xcode-derived | xcbeautify

      - name: Zip app
        run: |
          test -x .build/xcode-derived/Build/Products/Release/SeekZip.app/Contents/MacOS/SeekZip
          ditto -c -k --keepParent .build/xcode-derived/Build/Products/Release/SeekZip.app SeekZip-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SeekZip-macOS
          path: SeekZip-macOS.zip
          retention-days: 30
